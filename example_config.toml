# 天气系统配置模板（example_config.toml）
#
# 用法：
#   1. 复制本文件为 config.toml
#        cp example_config.toml config.toml
#   2. 填写高德 Key，按需调整限流与缓存
#   3. 确保 config.toml 对 PHP 运行用户（宝塔 www）可写，权限建议 644
#
# 注意：
# - 本文件只是模板，程序实际读取 config.toml
# - 修改 config.toml 后下一次请求自动热重载
# - 保存配置或检测到外部修改时，自动备份到根目录 config_backups/（保留最近 20 份）
# - app_version / timezone / language / database_path 属于请求级配置，下一次请求生效
# - 高德 Key 属于敏感信息，不要提交到公开仓库

# ===== 站点与运行 =====
site_name = "天气中心"
site_icon = "favicon.svg"           # 页面图标：URL、data:image/... 或相对路径
app_version = "1.1.0.1021"           # 四段式：主版本.次版本.修订号.累加更新号
admin_email = ""                    # 管理员验证/联系邮箱（可选）
timezone = "Asia/Shanghai"          # IANA 时区，例如 Asia/Shanghai
language = "zh-CN"                  # zh-CN / en-US
default_city = "深圳"
auto_refresh = 300                  # 默认自动刷新间隔（秒）
allow_origin = ""                   # 跨域白名单，逗号分隔；留空仅允许同源
trust_proxy = false                 # 使用 CDN / 反向代理时改为 true
register_enabled = true             # 是否开放用户注册

# ===== 数据库 =====
# 相对项目根目录，或填写绝对路径（如 /www/data/weather/weather.db）
database_path = "weather.db"

# ===== 高德开放平台 =====
# Web 服务 Key（后端天气 / 地点联想 / 地理编码）
amap_web_key = ""
# Web 服务安全密钥：仅在高德控制台开启数字签名时填写，否则留空
amap_web_secret = ""
# Web 端（JS API）Key 与安全密钥，用于前端地图
amap_js_key = ""
amap_js_security_code = ""
# 每日调用配额，用于后台看板估算；0 表示不限制
amap_daily_quota = 5000

# ===== 限流与配额 =====
guest_rate_limit = 60               # 游客每窗口业务请求上限
guest_amap_rate_limit = 20          # 游客每窗口高德代理请求上限
user_rate_limit = 120               # 登录账号每窗口配额
rate_window = 60                    # 限流窗口（秒）
login_fail_limit = 10               # 登录失败次数上限
login_fail_window = 600             # 登录失败统计窗口（秒）
guest_token_ttl = 3600              # 游客令牌有效期（秒）

# ===== 缓存与数据清理 =====
cache_ttl_weather = 600             # 天气缓存（秒）
cache_ttl_tips = 300                # 联想缓存（秒）
cache_ttl_regeo = 86400             # 逆地理缓存（秒）
cache_ttl_geocode = 86400           # 地理编码缓存（秒）
log_retain_days = 30                # 日志 / 调用记录保留天数

# ===== 更新与维护 =====
# 在线更新清单 HTTPS JSON 地址；留空则后台“检查更新”不可用
update_manifest_url = ""