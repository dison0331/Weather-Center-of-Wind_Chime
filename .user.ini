; ---------------------------------------------------------------------------
; 宝塔面板 / PHP-FPM 用户级配置（.user.ini）
;
; 原文件中的 open_basedir=/data/wwwweb/weather.yousb.top/:/tmp/ 属于旧主机路径，
; 在宝塔服务器上该目录不存在，会导致所有 PHP 请求 500，因此已移除。
;
; 宝塔开启「网站 → 设置 → 网站目录 → 防跨站攻击(open_basedir)」时，面板会自动
; 写入当前站点路径。如需手动指定，请取消下一行注释并改为本站点真实根目录：
; open_basedir=/www/wwwroot/weather.yousb.top/:/tmp/
;
; 注意：.user.ini 由 PHP-FPM 缓存，修改后最长约 5 分钟生效，可在宝塔重启 PHP 立即生效。
; ---------------------------------------------------------------------------
display_errors=Off
log_errors=On