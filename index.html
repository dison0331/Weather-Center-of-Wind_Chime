<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气中心 · 入口</title>
<style>
:root{--bg:#f2f6fc;--panel:#fff;--text:#1b2735;--muted:#6b7c93;--accent:#2f6fed;--shadow:0 18px 50px rgba(31,66,135,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#dbe9ff,transparent 45%),radial-gradient(circle at 85% 90%,#e4f2ff,transparent 40%),var(--bg);color:var(--text);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
.wrap{width:min(760px,100%);background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:38px 40px}
h1{margin:0 0 6px;font-size:30px;letter-spacing:.5px}
.sub{color:var(--muted);margin:0 0 26px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{border:1px solid #e3ebf6;border-radius:14px;padding:20px;transition:.2s;background:linear-gradient(160deg,#f7faff,#fff)}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(47,111,237,.14);border-color:#bcd2f7}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0 0 14px;color:var(--muted);font-size:13px;min-height:44px}
.card a{display:inline-block;padding:9px 18px;border-radius:9px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px;font-weight:600}
.card a.ghost{background:#eef4ff;color:var(--accent)}
.foot{margin-top:24px;font-size:12px;color:var(--muted);line-height:1.8;border-top:1px dashed #e3ebf6;padding-top:14px}
@media(max-width:640px){.cards{grid-template-columns:1fr}.wrap{padding:26px 22px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>天气中心</h1>
  <p class="sub">基于高德开放平台的实时天气与预报系统 · PHP + SQLite</p>
  <div class="cards">
    <div class="card">
      <h3>用户端</h3>
      <p>搜索城市、查看实时天气与未来预报、地图标注、关注城市、深色模式与自动刷新。</p>
      <a href="user.html">进入用户端</a>
    </div>
    <div class="card">
      <h3>管理后台</h3>
      <p>数据看板、访问日志、账号封禁、高德 Key 与限流参数配置、IP / 指纹黑名单。</p>
      <a class="ghost" href="admin.html">进入管理后台</a>
    </div>
  </div>
  <div class="foot">
    首次部署：访问 <b>api.php?action=ping</b> 完成建库初始化，默认管理员账号与完整步骤见 <b>doc/README.md</b>。<br>
    登录后台后请立即修改管理员密码；高德密钥仅保存在服务端 SQLite，前端通过 api.php 与 amap-js-proxy.php 代理访问，源码不含明文 Key。
  </div>
</div>
</body>
</html>
